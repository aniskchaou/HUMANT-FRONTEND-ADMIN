# --- Database Configuration (overrideable via launcher environment variables) ---
spring.datasource.url=${HUMANT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/humant}
spring.datasource.username=${HUMANT_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${HUMANT_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=${HUMANT_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${HUMANT_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ensure data.sql is executed at startup
spring.datasource.initialization-mode=always
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Stripe Configuration ---
# Replace with your actual keys from https://dashboard.stripe.com/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}

# --- App base URL (used for Stripe redirect URLs) ---
app.base-url=${APP_BASE_URL:http://localhost:4201}

